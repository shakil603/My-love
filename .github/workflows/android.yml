name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: Save error log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "^e: |error:|FAILURE|Caused by|What went wrong|> Task .* FAILED" build-log.txt | head -120 > ci-error.txt || true
          [ -s ci-error.txt ] || tail -120 build-log.txt > ci-error.txt
          SHA=$(gh api "repos/${{ github.repository }}/contents/ci-error.log?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-error.log" -f message="ci: error log" -f content="$(base64 -w0 ci-error.txt)" -f branch="${{ github.ref_name }}" -f sha="$SHA"
          else
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-error.log" -f message="ci: error log" -f content="$(base64 -w0 ci-error.txt)" -f branch="${{ github.ref_name }}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Amora-v0.5.0-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: "Amora v0.5.0"
          body: |
            Fourth release — professional icon system, redesigned audio/video calls, user profiles, and 8 new screens for **Amora** (the My-Love platform) — Kotlin + Jetpack Compose.

            **Included screens:** Onboarding · Sign-up · OTP · Feed · Stories · Reels · Discover · Match · Chats · Conversation · Video Call · Upload sheet · Comments · Notifications · Search · Spaces · Task Board · Calendar · Shop · Wallet · Settings · Safety Center · Profile.

            **Install:** download `Amora-v0.5.0-debug.apk` on your Android phone (Android 8.0+), allow "install from unknown sources", open it. Internet needed for demo images.
          prerelease: true
          files: Amora-v0.5.0-debug.apk
