name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: Save error log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "^e: |error:|FAILURE|Caused by|What went wrong|> Task .* FAILED" build-log.txt | head -120 > ci-error.txt || true
          [ -s ci-error.txt ] || tail -120 build-log.txt > ci-error.txt
          SHA=$(gh api "repos/${{ github.repository }}/contents/ci-error.log?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-error.log" -f message="ci: error log" -f content="$(base64 -w0 ci-error.txt)" -f branch="${{ github.ref_name }}" -f sha="$SHA"
          else
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-error.log" -f message="ci: error log" -f content="$(base64 -w0 ci-error.txt)" -f branch="${{ github.ref_name }}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Amora-v1.0.0-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Amora v1.0.0 — complete release"
          body: |
            **Amora 1.0.0 — the complete release.** Messaging + dating + social + work in one app, built on a 100% open-source stack.

            REAL features: live E2E-encrypted messaging (AES-256-GCM over the open MQTT network), real encrypted audio/video calls (Jitsi/WebRTC on an open-source server), global + private rooms, 14 languages with Android per-app language support, runtime permissions, on-device message persistence, 35+ screens.

            **Install:** download `Amora-v1.0.0-debug.apk` (Android 8.0+), allow "install from unknown sources", open it.
            **Try it live:** install on two phones -> Chats -> Live messaging -> join the same room code -> chat and call for real.
          prerelease: false
          files: Amora-v1.0.0-debug.apk
