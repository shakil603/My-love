name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Amora-v0.2.0-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: "Amora v0.2.0 - first APK"
          body: |
            Second release — 22+ screens of **Amora** (the My-Love platform) — Kotlin + Jetpack Compose.

            **Included screens:** Onboarding · Sign-up · OTP · Feed · Stories · Reels · Discover · Match · Chats · Conversation · Video Call · Upload sheet · Comments · Notifications · Search · Spaces · Task Board · Calendar · Shop · Wallet · Settings · Safety Center · Profile.

            **Install:** download `Amora-v0.2.0-debug.apk` on your Android phone (Android 8.0+), allow "install from unknown sources", open it. Internet needed for demo images.
          prerelease: true
          files: Amora-v0.2.0-debug.apk
